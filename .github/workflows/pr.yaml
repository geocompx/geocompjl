on:
  workflow_dispatch:
  pull_request:
    branches:
      [main]
name: Quarto PR Publish
jobs:
  bookdown:
    name: GH-Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      deployments: write
    env:
      DISPLAY: ':0'
      QUARTO_JULIA_PROJECT: '@quarto'
      DATADEPS_ALWAYS_ACCEPT: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - uses: julia-actions/setup-julia@v2
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Install QuartoNotebookRunner into @quarto environment
        run: julia --project=@quarto -e 'import Pkg; Pkg.add("QuartoNotebookRunner"); Pkg.precompile()'

      - name: Start QuartoNotebookRunner server
        run: |
          nohup xvfb-run -a -s '-screen 0 1024x768x24' julia --project=@quarto \
            -e 'import QuartoNotebookRunner; QuartoNotebookRunner.serve(; port = 1234)' \
            > qnr-server.log 2>&1 &
          echo "QNR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1234) 2>/dev/null; then
              echo "QNR server listening on :1234 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "QNR server did not start in 60s; continuing anyway"
          tail -50 qnr-server.log || true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto site
        run: xvfb-run -a -s '-screen 0 1024x768x24' quarto render --to html

      - name: Deploy Preview to Netlify as preview
        id: netlify-deploy
        uses: nwtgck/actions-netlify@v3
        env:
          NETLIFY_SITE_ID: e18690e5-215e-4584-b0f1-963bc99a10d0
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          publish-dir: './docs'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Deploy from GHA: ${{ github.event.pull_request.title || format('manual from PR {0}', github.event.issue.number) }}
          alias: deploy-preview-${{ github.event.pull_request.number || github.event.issue.number }}
          # these all default to 'true'
          enable-pull-request-comment: true
          enable-commit-comment: false
          enable-commit-status: true
          overwrites-pull-request-comment: false
        timeout-minutes: 1

      - name: Show QuartoNotebookRunner server log
        if: always()
        run: cat qnr-server.log 2>/dev/null || true
