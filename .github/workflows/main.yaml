on:
  workflow_dispatch:
  push:
    branches:
      [main]
name: Quarto Publish
jobs:
  quarto:
    name: GH-Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    env:
      QUARTO_JULIA_PROJECT: "@quarto"
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-julia-and-quarto.yml
      - name: Render and Publish (main branch only)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: netlify
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}